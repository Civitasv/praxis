[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-ai-tutor"
version = "0.1.0a0"
description = "Harness-neutral AI tutor foundations for software development"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
praxis = "praxis.cli:main"

[tool.setuptools.packages.find]
include = ["praxis*"]
